version: '3.8'

services:
  db:
    image: postgres:14-alpine
    container_name: fraud-db
    environment:
      - POSTGRES_DB=frauddetection
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: fraud-app
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/frauddetection
      - DB_USER=postgres
      - DB_PASSWORD=postgres

volumes:
  postgres_data:
